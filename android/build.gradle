apply plugin: 'com.android.library'

android {
    namespace "com.sskj.flutter_plugin_ad"
    compileSdk 34
    buildToolsVersion '34.0.0'
//    显式声明插件使用的 NDK 版本，避免回落到 AGP 默认版本（如 27.x），
//    从而强制接入方下载额外的 NDK；这里与 Flutter 3.24.x 的 flutter.ndkVersion 保持一致。
//    接入方 app 只需要 android.ndkVersion >= 该版本即可通过 Flutter 的 NDK 校验。
    ndkVersion '23.1.7779620'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        // 64K 方法数问题，官方文档要求开启
        multiDexEnabled true
    }

    //app目录下加入这个代码
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    //android基础包
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'com.google.code.gson:gson:2.8.6'

    //基础包 start
    implementation("com.shenshi:ad-openset-sdk:6.5.9.2")
    //基础包 end

    //    百度 start
    // 注意百度9.373版本开始，强制使用Androidx，如果使用这个版本以上的百度sdk，请将项目改为Androidx
    implementation 'com.shenshi:ad-baidu-adapter:9.450.5'
    //    百度 end

//    穿山甲&GroMore start
    implementation("com.shenshi:ad-gromore-adapter:7.7.1.6.1")// 纯广告SDK

    //因为tanx会依赖第三方库 implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0' 会和 gromore短剧的依赖库冲突，如果不使用tanx，请按照这个对接
//    implementation("com.shenshi:ad-gromore-ct-adapter:7.7.1.6.1") // 包括广告和短剧内容SDK

    //因为tanx会依赖第三方库 implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.0' 会和 gromore短剧的依赖库冲突，如果使用tanx，请按照这个对接
//    implementation("com.shenshi:ad-gromore-ct-adapter:7.7.1.6.1") {
//        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
//    }// 包括广告和短剧内容SDK

    //注意！！! 穿山甲短剧依赖okhttp，如果没有会闪退，如果已经添加请忽略，没有添加请添加okhttp，
    //另外，tanx默认依赖okhttp，如果 已经依赖了tanx，也不需要再添加okhttp
//    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
//    穿山甲&GroMore end

    //sigmob start
    implementation("com.shenshi:ad-sigmob-adapter:4.25.81.1")
    //sigmob end

    //快手 start
    implementation 'com.shenshi:ad-kuaishou-adapter:5.6.10.1.1'// 快手-纯广告SDK
    //快手 end

    //广点通 start
    implementation 'com.shenshi:ad-guangdiantong-adapter:4.690.1560.7'
    //广点通 end

    //倍孜 start
    implementation 'com.shenshi:ad-beizi-adapter:5.5.0.2.6'
    //倍孜 end

    //tanx start
    implementation 'com.shenshi:ad-tanx-adapter:3.7.37.4'
    //tanx end

    //海量 start
    implementation 'com.shenshi:ad-hailiang-adapter:3.482.14.448.1'
    //海量 end

    //章鱼 start
    implementation 'com.shenshi:ad-zhangyu-adapter:2.6.8.11.1'
    //章鱼 end

    //华为 start
    // 如要对接华为广告渠道，除本适配器外还需要在 app 模块引入 com.huawei.hms:ads-lite
    implementation 'com.shenshi:ad-huawei-adapter:13.4.90.300.1'
    //华为 end

    //multidex 64K问题，如果已添加请忽略
    implementation 'androidx.multidex:multidex:2.0.1'

    //微信小程序广告预算相关，引入可提升ecpm。强烈建议引入
    /**
     * 1，进入微信开放平台创建移动应用;
     * 2，应用创建完成后，获取到相应的微信ApplD;
     * 3.在移动端嵌入最新版OpenSDK，并确认版本为5.3.1及以上;
     * 4.在优量汇开发者平台，将微信开放平台填写的AppID与当前应用进行关联;
     * 第四步联系我们运营帮你们配置
     */
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.28'
}